# Aurora Lily58, nice!nano v2, nice!view

# Displays (nice!view comes in through the shield list in build.yaml)
CONFIG_ZMK_DISPLAY=y

# Underglow: solid colour per Bluetooth host, set by the FN+1..5 macros
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Battery: deep sleep after 30 min idle, show the right half's battery on the left display
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Bluetooth: stronger radio, helps when the halves sit on different thighs
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
